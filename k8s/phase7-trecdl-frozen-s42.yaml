apiVersion: v1
kind: Pod
metadata:
  name: phase7-trecdl-frozen-s42
  namespace: taskmap-training
  labels:
    experiment: phase7-trecdl
    method: frozen
    seed: "42"
spec:
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/hostname: pokprod-b93r38s1
  containers:
  - name: trainer
    image: nvcr.io/nvidia/pytorch:24.07-py3
    command: ["/bin/bash", "-c"]
    securityContext:
      runAsUser: 0
    args:
    - |
      nvidia-smi | head -5 &&
      echo "=== Installing dependencies ===" &&
      pip install -q \
        'transformers>=4.40,<4.50' \
        'peft>=0.10,<0.15' \
        'accelerate>=0.30,<0.35' \
        datasets \
        rouge-score \
        sacrebleu \
        sentencepiece \
        tqdm \
        pyyaml \
        scikit-learn \
        scipy \
        pyserini \
        pytrec-eval-terrier \
        faiss-cpu &&
      echo "=== Cloning TaskMap ===" &&
      git clone https://github.com/liangwen12year/TaskMap.git /workspace/TaskMap &&
      cd /workspace/TaskMap &&
      echo "=== Phase 7: TREC-DL 2019 Frozen Baseline ===" &&
      python -u eval_trecdl.py \
        --model_type frozen \
        --backbone Qwen/Qwen2.5-1.5B \
        --seed 42 \
        --top_k 100 \
        --output_dir outputs/trecdl_frozen_s42 &&
      echo "=== RESULTS ===" &&
      cat outputs/trecdl_frozen_s42/results_frozen_s42.json &&
      echo "=== DONE ==="
    resources:
      limits:
        nvidia.com/gpu: 1
        memory: 80Gi
        cpu: "16"
      requests:
        nvidia.com/gpu: 1
        memory: 48Gi
        cpu: "8"
    volumeMounts:
    - name: workspace
      mountPath: /workspace
    - name: shm
      mountPath: /dev/shm
    - name: hf-cache
      mountPath: /root/.cache/huggingface
    env:
    - name: HF_HOME
      value: /root/.cache/huggingface
    - name: TOKENIZERS_PARALLELISM
      value: "false"
    - name: HF_TOKEN
      value: "SET_YOUR_HF_TOKEN_HERE"
    - name: JAVA_HOME
      value: /usr/lib/jvm/java-11-openjdk-amd64
  volumes:
  - name: workspace
    emptyDir:
      sizeLimit: 150Gi
  - name: shm
    emptyDir:
      medium: Memory
      sizeLimit: 16Gi
  - name: hf-cache
    emptyDir:
      sizeLimit: 50Gi
