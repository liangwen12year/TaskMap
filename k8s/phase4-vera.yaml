apiVersion: v1
kind: Pod
metadata:
  name: phase4-vera
  namespace: taskmap-training
  labels:
    experiment: phase4-missing-baselines
spec:
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/hostname: pokprod-b93r38s1
  containers:
  - name: trainer
    image: nvcr.io/nvidia/pytorch:24.07-py3
    command: ["/bin/bash", "-c"]
    securityContext:
      runAsUser: 0
    env:
    - name: TASKMAP_EVAL_EXAMPLES
      value: "500"
    args:
    - |
      nvidia-smi | head -5 &&
      pip install -q 'transformers>=4.40,<4.50' 'peft>=0.10,<0.15' 'accelerate>=0.30,<0.35' datasets rouge-score sacrebleu sentencepiece tqdm pyyaml &&
      git clone https://github.com/liangwen12year/TaskMap.git /workspace/TaskMap &&
      cd /workspace/TaskMap &&
      echo "=== VeRA r=256 baseline ===" &&
      python -u train.py --mode vera --backbone Qwen/Qwen2.5-1.5B \
        --lora_rank 256 --max_steps 6000 \
        --microbatch_size 4 --gradient_accumulation_steps 8 \
        --output_dir outputs/vera_r256 --seed 42 &&
      echo "=== VeRA eval ===" &&
      python -u run_eval.py --mode vera --backbone Qwen/Qwen2.5-1.5B \
        --checkpoint outputs/vera_r256/final --lora_rank 256 \
        --output_file outputs/eval_vera_r256.json --max_examples 500 &&
      echo "=== RESULTS ===" && cat outputs/eval_vera_r256.json &&
      echo "=== DONE ==="
    resources:
      limits:
        nvidia.com/gpu: 1
        memory: 80Gi
        cpu: "16"
      requests:
        nvidia.com/gpu: 1
        memory: 40Gi
        cpu: "8"
    volumeMounts:
    - name: workspace
      mountPath: /workspace
    - name: shm
      mountPath: /dev/shm
  volumes:
  - name: workspace
    emptyDir:
      sizeLimit: 100Gi
  - name: shm
    emptyDir:
      medium: Memory
      sizeLimit: 16Gi
