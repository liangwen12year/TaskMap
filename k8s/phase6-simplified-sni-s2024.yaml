apiVersion: v1
kind: Pod
metadata:
  name: phase6-simplified-sni-s2024
  namespace: taskmap-training
  labels:
    experiment: phase6-wsdm-final
spec:
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/hostname: pokprod-b93r38s1
  containers:
  - name: trainer
    image: nvcr.io/nvidia/pytorch:24.07-py3
    command: ["/bin/bash", "-c"]
    securityContext:
      runAsUser: 0
    env:
    - name: HF_TOKEN
      value: "SET_YOUR_HF_TOKEN_HERE"
    - name: HF_HOME
      value: /root/.cache/huggingface
    - name: TOKENIZERS_PARALLELISM
      value: "false"
    args:
    - |
      sleep 360 &&
      nvidia-smi | head -5 &&
      pip install -q 'transformers>=4.40,<4.50' 'peft>=0.10,<0.15' 'accelerate>=0.30,<0.35' datasets rouge-score sacrebleu sentencepiece tqdm pyyaml scikit-learn scipy &&
      git clone https://github.com/liangwen12year/TaskMap.git /workspace/TaskMap &&
      cd /workspace/TaskMap &&
      echo "=== Phase 6: Simplified TaskMap (rho=1) SNI cold-start, seed 2024 ===" &&
      python -u train_taskmap_scaled.py \
        --config configs/taskmap_no_topology.yaml \
        --backbone Qwen/Qwen2.5-1.5B \
        --max_steps 12000 \
        --active_fraction 1.0 \
        --unfreeze_mapper \
        --seed 2024 \
        --max_per_task 2000 \
        --max_eval_examples 200 \
        --save_every 6000 \
        --output_dir outputs/phase6_simplified_s2024 &&
      echo "=== DONE ==="
    resources:
      limits:
        nvidia.com/gpu: 1
        memory: 80Gi
        cpu: "16"
      requests:
        nvidia.com/gpu: 1
        memory: 48Gi
        cpu: "8"
    volumeMounts:
    - name: workspace
      mountPath: /workspace
    - name: shm
      mountPath: /dev/shm
    - name: hf-cache
      mountPath: /root/.cache/huggingface
  volumes:
  - name: workspace
    emptyDir:
      sizeLimit: 150Gi
  - name: shm
    emptyDir:
      medium: Memory
      sizeLimit: 16Gi
  - name: hf-cache
    emptyDir:
      sizeLimit: 50Gi
