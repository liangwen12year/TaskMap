apiVersion: v1
kind: Pod
metadata:
  name: phase6-contextual-dropout
  namespace: taskmap-training
  labels:
    experiment: phase6-contextual-dropout
spec:
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/hostname: pokprod-b93r38s1
  containers:
  - name: trainer
    image: nvcr.io/nvidia/pytorch:24.07-py3
    command: ["/bin/bash", "-c"]
    securityContext:
      runAsUser: 0
    args:
    - |
      nvidia-smi | head -5 &&
      echo "=== Installing dependencies ===" &&
      pip install -q \
        'transformers>=4.40,<4.50' \
        'peft>=0.10,<0.15' \
        'accelerate>=0.30,<0.35' \
        datasets \
        rouge-score \
        sacrebleu \
        sentencepiece \
        tqdm \
        pyyaml \
        scikit-learn \
        scipy &&
      echo "=== Cloning TaskMap ===" &&
      git clone https://github.com/liangwen12year/TaskMap.git /workspace/TaskMap &&
      cd /workspace/TaskMap &&
      echo "=== Starting contextual desc + residual dropout training ===" &&
      python -u train_taskmap.py \
        --config configs/taskmap_no_topology.yaml \
        --backbone Qwen/Qwen2.5-1.5B \
        --active_fraction 0.75 \
        --unfreeze_mapper \
        --max_steps 6000 \
        --seed 42 \
        --contextual_desc \
        --residual_dropout 0.5 \
        --eval_paraphrases &&
      echo "=== DONE ==="
    resources:
      limits:
        nvidia.com/gpu: 1
        memory: 80Gi
        cpu: "16"
      requests:
        nvidia.com/gpu: 1
        memory: 40Gi
        cpu: "8"
    volumeMounts:
    - name: workspace
      mountPath: /workspace
    - name: shm
      mountPath: /dev/shm
    env:
    - name: TASKMAP_EVAL_EXAMPLES
      value: "500"
    - name: TOKENIZERS_PARALLELISM
      value: "false"
  volumes:
  - name: workspace
    emptyDir:
      sizeLimit: 100Gi
  - name: shm
    emptyDir:
      medium: Memory
      sizeLimit: 16Gi
